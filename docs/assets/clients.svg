<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="Supported client setup cards">
  <rect width="1180" height="560" rx="30" fill="#0B1633"/>
  <text x="70" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="850" fill="#FFFFFF">Connect tools that support custom AI sources</text>
  <text x="70" y="118" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#BFD0EA">Copy a URL or env snippet from the desktop app. No client configuration files are modified automatically.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="170" width="318" height="278" rx="22" fill="#FFFFFF"/>
    <circle cx="124" cy="226" r="28" fill="#26C8A8"/>
    <text x="108" y="237" font-size="29" font-weight="900" fill="#FFFFFF">A</text>
    <text x="166" y="218" font-size="22" font-weight="800" fill="#102243">Android Studio AI</text>
    <text x="166" y="248" font-size="15" fill="#64748B">Anthropic-compatible schema</text>
    <rect x="100" y="294" width="248" height="52" rx="12" fill="#EEF6FF"/>
    <text x="118" y="326" font-size="14" fill="#183A69">/anthropic/v1/messages</text>
    <rect x="100" y="362" width="248" height="52" rx="12" fill="#F2FBF7"/>
    <text x="118" y="394" font-size="14" fill="#14724F">/anthropic/v1/models</text>

    <rect x="432" y="170" width="318" height="278" rx="22" fill="#FFFFFF"/>
    <circle cx="486" cy="226" r="28" fill="#2F75FF"/>
    <text x="469" y="237" font-size="29" font-weight="900" fill="#FFFFFF">C</text>
    <text x="528" y="218" font-size="22" font-weight="800" fill="#102243">Copilot-style Plugins</text>
    <text x="528" y="248" font-size="15" fill="#64748B">OpenAI or Anthropic base URL</text>
    <rect x="462" y="294" width="248" height="52" rx="12" fill="#EEF6FF"/>
    <text x="480" y="326" font-size="14" fill="#183A69">/v1/chat/completions</text>
    <rect x="462" y="362" width="248" height="52" rx="12" fill="#FFF8E5"/>
    <text x="480" y="394" font-size="14" fill="#7B5C00">reasoning_content replay</text>

    <rect x="794" y="170" width="318" height="278" rx="22" fill="#FFFFFF"/>
    <circle cx="848" cy="226" r="28" fill="#FFD166"/>
    <text x="831" y="237" font-size="29" font-weight="900" fill="#21314F">D</text>
    <text x="890" y="218" font-size="22" font-weight="800" fill="#102243">Claude Code</text>
    <text x="890" y="248" font-size="15" fill="#64748B">DeepSeek thinking compatibility</text>
    <rect x="824" y="294" width="248" height="52" rx="12" fill="#EEF6FF"/>
    <text x="842" y="326" font-size="14" fill="#183A69">thinking.type=adaptive</text>
    <rect x="824" y="362" width="248" height="52" rx="12" fill="#F2FBF7"/>
    <text x="842" y="394" font-size="14" fill="#14724F">deepseek-v4-pro[1m]</text>
  </g>
</svg>
