<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-label="Gateway request flow">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 10 6 2 10Z" fill="#285CA8"/>
    </marker>
  </defs>
  <rect width="1180" height="500" rx="30" fill="#F4F8FF"/>
  <text x="66" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#11233F">One local gateway, many AI clients</text>
  <text x="66" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#53657F">Clients keep their own API keys. The desktop app stores profiles and fixes protocol differences locally.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="66" y="172" width="244" height="184" rx="20" fill="#FFFFFF" stroke="#C9D8EF"/>
    <text x="100" y="218" font-size="20" font-weight="800" fill="#11233F">IDE / Agent Clients</text>
    <text x="100" y="258" font-size="16" fill="#445772">Android Studio AI</text>
    <text x="100" y="290" font-size="16" fill="#445772">Copilot-style plugins</text>
    <text x="100" y="322" font-size="16" fill="#445772">Claude Code / Cline / Roo</text>

    <rect x="468" y="152" width="286" height="224" rx="24" fill="#0E2E67"/>
    <text x="514" y="206" font-size="22" font-weight="800" fill="#FFFFFF">DeepSeek Gateway</text>
    <text x="514" y="250" font-size="16" fill="#CFE0FF">127.0.0.1 only</text>
    <text x="514" y="282" font-size="16" fill="#CFE0FF">Anthropic + OpenAI routes</text>
    <text x="514" y="314" font-size="16" fill="#CFE0FF">Reasoning / SSE fixes</text>

    <rect x="898" y="172" width="216" height="184" rx="20" fill="#FFFFFF" stroke="#C9D8EF"/>
    <text x="938" y="226" font-size="22" font-weight="800" fill="#11233F">DeepSeek API</text>
    <text x="938" y="268" font-size="16" fill="#445772">chat/completions</text>
    <text x="938" y="300" font-size="16" fill="#445772">anthropic/messages</text>
  </g>
  <path d="M328 264H446" stroke="#285CA8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M776 264H876" stroke="#285CA8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="356" y="222" width="76" height="32" rx="16" fill="#EAF2FF"/>
  <text x="370" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#285CA8">proxy</text>
  <rect x="804" y="222" width="54" height="32" rx="16" fill="#EAF2FF"/>
  <text x="818" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#285CA8">TLS</text>
