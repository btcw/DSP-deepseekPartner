[package]
name = "deepseek-gateway-desktop"
version = "1.0.0"
description = "A desktop gateway for DeepSeek-compatible agent clients"
authors = ["DeepSeek Gateway Contributors"]
edition = "2021"

[lib]
name = "deepseek_gateway_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deepseek-gateway-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.7", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1.2"
portpicker = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.6.0", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-opener = "2.4.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "io-util", "time", "signal"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.16"
tower = "0.5"
wiremock = "0.6"
